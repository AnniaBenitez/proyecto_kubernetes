apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: devops-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: anniamicaela/patient-frontend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
          readinessProbe:
  tcpSocket:
    port: 5173
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 6

livenessProbe:
  tcpSocket:
    port: 5173
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: devops-lab
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 5173
      targetPort: 5173
      nodePort: 30173
  type: NodePort

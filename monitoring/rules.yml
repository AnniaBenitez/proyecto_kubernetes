groups:
  - name: backend-alerts
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "Backend caído"
          description: "El backend no está respondiendo a Prometheus"
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[1m]) > 0.1
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Alta tasa de errores"